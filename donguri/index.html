function sh(title,sub){return `<div class="sheet-head"><div><h2>${title}</h2><p>${sub||''}</p></div><button class="close" data-close aria-label="閉じる">×</button></div>`;}
function showGuess(msg=''){if(busy||winning)return;const n=levels[level].n, role=(type,head,sign)=>`<div class="roles"><div class="role-heading"><span class="token ${type==='minus'?'minus':''}">${sign}</span>${head}</div><div class="role-grid">${animals.slice(0,n).map((a,i)=>`<button class="role-opt ${((type==='plus'?guessedPlus:guessedMinus)===i?'sel':'')} ${type==='minus'?'minus':''}" data-type="${type}" data-id="${i}">${svgAnimal(a.id,'character')}<small>${a.name}</small></button>`).join('')}</div></div>`;
showSheet(sh('だれが本当を言っていない？','ふたりの正体を、推理から決めよう。')+(msg?`<div class="sheet-message">${msg}</div>`:'')+role('plus','見栄っ張りは、だれ？','+')+role('minus','控えめなのは、だれ？','−')+`<button class="sheet-cta" id="confirm" ${guessedPlus<0||guessedMinus<0?'disabled':''}>このふたりで決める　→</button>`);
$('overlay').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id,role=b.dataset.type;if(role==='plus'){guessedPlus=guessedPlus===id?-1:id;if(guessedMinus===id)guessedMinus=-1;}else{guessedMinus=guessedMinus===id?-1:id;if(guessedPlus===id)guessedPlus=-1;}sfx('pick');showGuess();});$('confirm').onclick=verify;}
function verify(){if(guessedPlus<0||guessedMinus<0)return;const st=levels[level];if(hypotheses().length>1){sfx('wrong');showGuess('まだ別の可能性が残っているよ。計量の記録だけで確実にわかるよう、もう少し調べよう。');return;}
if(guessedPlus!==st.plus||guessedMinus!==st.minus){sfx('wrong');showGuess('この組み合わせは証拠と合わないみたい。木札を見比べてみて。');return;}
winning=true;saved.best??={};if(!saved.best[level]||saved.best[level]>records.length)saved.best[level]=records.length;persist();sfx('win');showWin();}
function showWin(){const st=levels[level],grade=records.length<=(st.n===3?2:st.n===4?3:3)?3:records.length<=(st.n===3?3:st.n===4?4:4)?2:1;
showSheet(sh('森のひみつが解けた！','ふたりの申告が、数字でつながった。')+`<div class="win-banner"><div class="star">${'✦ '.repeat(grade)}<span style="opacity:.23">${'✦ '.repeat(3-grade)}</span></div><h3>おみごと。</h3><p style="font-size:12px;color:#8a9789">${records.length}回の計量で、ふたりを見破った</p></div><div class="win-answer"><div class="win-portrait">${svgAnimal(animals[st.plus].id)}<strong>${animals[st.plus].name}</strong><small>見栄っ張り ＋1</small></div><div class="win-portrait">${svgAnimal(animals[st.minus].id)}<strong>${animals[st.minus].name}</strong><small>控えめ −1</small></div></div><div class="win-summary">集めた木札をすべて満たす組み合わせは、全${st.n*(st.n-1)}通りのうち、この1通りだけ。自分で見つけた、たしかな答えだよ。</div><button class="sheet-cta" id="nextbtn">${level===levels.length-1?'最初のレベルへ ↺':'次のおはなしへ →'}</button>`);
$('nextbtn').onclick=()=>{level=(level+1)%levels.length;memoMarks=[];reset();};}
function help(){showSheet(sh('森のはかりばのあそび方','どんぐりの数から、ほんとうを見つけよう。')+`<div class="sheet-well"><p><b>①　ふたりの袋をはかる</b><br>動物を2匹タップ、または袋を計量台にドラッグ。個々の袋は開けず、ふたりの<b>本当の合計</b>だけがわかるよ。</p><p><b>②　数字のズレをくらべる</b><br>申告合計 − 本当の合計 が <b>＋1</b>なら多く申告した子がまじっている。<b>0</b>でも嘘が打ち消しあっていることがある。</p><p><b>③　正体を見破る</b><br>この12問では見栄っ張りが1匹、控えめが1匹。木札を組み合わせ、別の可能性がなくなるまで考えてね。</p><p><b>✎　メモ</b><br>メモを押したあと動物をタップすると、＋・−・未設定を切り替えられる。メモは答えに影響しないよ。</p></div><button class="sheet-cta" data-close>あそびに戻る</button>`);$('overlay').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);}
function hint(){const r=records.at(-1);const add=r?(r.delta===0?'差0は「正直者2匹」または「正反対の嘘2匹」だよ。':r.delta>0?'＋1なら見栄っ張りと正直者が組になっているよ。':'−1なら控えめと正直者が組になっているよ。'):'';showSheet(sh('ちいさなヒント','答えを直接見せず、考える方向だけ。')+`<div class="sheet-well">${levels[level].hint}<br><br>${add}</div><button class="sheet-cta" data-close>もう一度考える</button>`);$('overlay').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);}
function levelMenu(){showSheet(sh('森の12のおはなし','好きな問題から遊べるよ。')+`<div class="level-grid">${levels.map((st,i)=>`<button class="level-tile ${i===level?'active':''} ${saved.best?.[i]?'done':''}" data-lv="${i}"><b>${pad(i)}</b><small>${saved.best?.[i]?(saved.best[i]+'回'):st.n+'ひき'}</small></button>`).join('')}</div>`);$('overlay').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{level=+b.dataset.lv;memoMarks=[];reset();});}
$('helpbtn').onclick=help;$('hintbtn').onclick=hint;$('solvebtn').onclick=()=>{guessedPlus=guessedMinus=-1;showGuess()};$('levelchip').onclick=levelMenu;$('levelmenu').onclick=levelMenu;$('memobtn').onclick=()=>{memoMode=!memoMode;pick=[];sfx('note');draw()};$('soundbtn').onclick=()=>{soundOn=!soundOn;persist();draw();if(soundOn)sfx('pick')};
window.__acornV02={get state(){return {level,records:records.slice(),hypotheses:hypotheses(),plus:levels[level].plus,minus:levels[level].minus,busy,winning,selected:pick.slice(),compare:compare.slice()}},goto(i){if(i>=0&&i<levels.length){level=i;memoMarks=[];reset()}},choose,reset,guess:showGuess,pressReceipt:receiptClick};memoMarks=[];draw();
})();
</script></body></html>
