function nAng(x){return Math.atan2(Math.sin(x),Math.cos(x))}
function delta(a,b){return nAng(b-a)}
function ease(t){return 1-Math.pow(1-t,3)}
function safeNum(x){return Number(x.toFixed(2))}
function eyePoint(a){return {x:.5+.72*Math.cos(a),y:.5+.72*Math.sin(a)}}
function projection(v,p){const dx=.5-v.x,dy=.5-v.y,L=Math.hypot(dx,dy),f=[dx/L,dy/L],r=[-f[1],f[0]],u=(p.x-v.x)*r[0]+(p.y-v.y)*r[1],d=(p.x-v.x)*f[0]+(p.y-v.y)*f[1],k=250/(.48+d);return {x:200+u*k,d,k}}

function sm(v){return safeNum(v)}
function tree(o,i){let p=projectWorld(o),s=p.scale*(.8+o.r*2.4),x=sm(p.x),y=sm(p.y),r=o.r*452*s;const tones=[['#467661','#6e9c79','#98b592'],['#52816d','#82a585','#b4c6a3'],['#477c69','#7caa8f','#a4bca0']][i%3];return `<g class="tree" transform="translate(${x} ${y}) scale(${sm(s)})"><ellipse cx="8" cy="11" rx="${sm(r*.84)}" ry="${sm(r*.3)}" fill="#385841" opacity=".15"/><path d="M-5 4 Q-3 -25 -7 -38 L8 -38 Q4 -15 6 5Z" fill="#807358"/><path d="M-2 -30 L-14 -58 M2 -27 L22 -60" stroke="#88795d" stroke-width="4.8" stroke-linecap="round"/><circle cx="-13" cy="${sm(-r*.9-26)}" r="${sm(r*.60)}" fill="${tones[0]}"/><circle cx="${sm(r*.5)}" cy="${sm(-r*.8-30)}" r="${sm(r*.66)}" fill="${tones[1]}"/><circle cx="2" cy="${sm(-r*1.45-23)}" r="${sm(r*.67)}" fill="${tones[0]}"/><circle cx="${sm(-r*.3)}" cy="${sm(-r*1.78-23)}" r="${sm(r*.41)}" fill="${tones[2]}" opacity=".83"/><path d="M${sm(-r*.75)} ${sm(-r*1.31-30)}Q${sm(-r*.22)} ${sm(-r*2.13-42)} ${sm(r*.2)} ${sm(-r*1.64-38)}" fill="none" stroke="#d1dfb9" stroke-width="3.1" opacity=".36"/></g>`}
function rock(o,i){let p=projectWorld(o),s=p.scale,sz=o.r*312*s,x=sm(p.x),y=sm(p.y);return `<g transform="translate(${x} ${y})"><ellipse cx="${sm(sz*.25)}" cy="8" rx="${sm(sz*1.05)}" ry="${sm(sz*.41)}" fill="#56705b" opacity=".14"/><path d="M${sm(-sz)} 0 L${sm(-sz*.80)} ${sm(-sz*.67)} L${sm(-sz*.24)} ${sm(-sz*1.12)} L${sm(sz*.42)} ${sm(-sz*.92)} L${sm(sz*.98)} ${sm(-sz*.4)} L${sm(sz)} 1 Q0 ${sm(sz*.20)} ${sm(-sz)} 0Z" fill="${i%2?'#8d9890':'#a0a69b'}"/><path d="M${sm(-sz*.8)} ${sm(-sz*.65)} L${sm(-sz*.24)} ${sm(-sz*1.12)} L${sm(sz*.05)} ${sm(-sz*.46)} L${sm(-sz*.18)} 0 L${sm(-sz)} 0Z" fill="#c5c8ba" opacity=".72"/><path d="M${sm(sz*.05)} ${sm(-sz*.46)} L${sm(sz*.42)} ${sm(-sz*.92)} L${sm(sz*.98)} ${sm(-sz*.4)} L${sm(sz)} 1 L${sm(-sz*.18)} 0Z" fill="#7c8d83" opacity=".45"/><path d="M${sm(-sz*.32)} ${sm(-sz*.96)}L${sm(sz*.22)} ${sm(-sz*.81)}" stroke="#e5ded0" stroke-width="2.2" opacity=".7"/></g>`}
function fox(spot){const p=projectWorld({x:spot[0],y:spot[1]}),s=p.scale*.82;return `<g transform="translate(${sm(p.x)} ${sm(p.y)}) scale(${sm(s)})" class="fox"><ellipse cx="5" cy="7" rx="22" ry="8" fill="#475b43" opacity=".18"/><path d="M11 -10 Q31 -42 39 -24 Q45 -8 17 1Z" fill="#bc7954" stroke="#ac704d" stroke-width=".7"/><path d="M31 -22 Q38 -20 38 -14 Q31 -15 26 -10Z" fill="#fff3d6"/><path d="M-13 -9 L-16 -36 L-2 -27 L8 -40 L15 -11Z" fill="#bb7150"/><path d="M-10 -29 L-7 -15 L0 -22Z M7 -31 L5 -15 L11 -26Z" fill="#f1c4a7"/><path d="M-14 -11 Q-9 -26 4 -22 Q18 -21 19 -5 Q15 9 -9 5 Q-20 -2 -14 -11Z" fill="#d18b60"/><path d="M-10 -3 Q1 6 16 -7 Q13 9 0 11 Q-10 10 -14 2Z" fill="#fff5dd"/><circle cx="7" cy="-10" r="1.8" fill="#354b3d"/></g>`}
function marker(spot,i){const p=projectWorld({x:spot[0],y:spot[1]}),x=sm(p.x),y=sm(p.y),isSel=chosen===i,win=solved&&level.target===i;return `<g data-spot="${i}" class="marker" transform="translate(${x} ${y})" style="cursor:pointer"><ellipse cy="3" rx="20" ry="7.8" fill="#61725b" opacity=".11"/><path d="M0 -5 L0 -17" stroke="#d4c7a9" stroke-width="1.8"/><circle cy="-20" r="${isSel?18:15}" fill="${isSel?'#bf8a66':'#fffaf0'}" stroke="${isSel?'#d8b599':'#d3d3b7'}" stroke-width="1.5"/><text y="-16" font-family="Georgia,serif" font-size="13" font-weight="600" text-anchor="middle" fill="${isSel?'#fffaf0':'#627e69'}">${i+1}</text>${isSel?'<circle cy="-20" r="23" fill="none" stroke="#ba8a61" stroke-width="1" stroke-dasharray="2 4"/>':''}${win?'<circle cy="-20" r="24" fill="none" stroke="#d19a74" stroke-width="3"/>':''}<circle cy="-18" r="27" fill="transparent" pointer-events="all"/></g>`}
function grass(p,scale=1){const z=projectWorld(p);return `<path d="M${sm(z.x-4)} ${sm(z.y)}q2 -9 5 -12 M${sm(z.x+2)} ${sm(z.y)}q4 -7 7 -9" fill="none" stroke="#91b496" stroke-width="${sm(1.6*scale)}" stroke-linecap="round" opacity=".66"/>`}
function owl(){return `<g transform="translate(197 528)"><ellipse cx="5" cy="25" rx="31" ry="9" fill="#4d694c" opacity=".13"/><path d="M-21 -1 Q-31 -27 -27 -44 L-12 -34 Q0 -40 12 -34 L28 -44 Q31 -22 22 0 Q12 17 0 15 Q-13 16 -21 -1Z" fill="#526f64"/><path d="M-14 -15 Q-6 -4 0 4 Q11 -4 15 -14" fill="none" stroke="#8eaa8e" stroke-width="4" stroke-linecap="round" opacity=".65"/><path d="M-9 13 L-10 19 M9 13 L10 19" stroke="#9a784f" stroke-width="4" stroke-linecap="round"/><path d="M-23 -4 Q-33 6 -22 17 Q-10 20 -11 0" fill="#638879"/><path d="M23 -4 Q33 6 22 17 Q10 20 11 0" fill="#638879"/><path d="M-17 22 Q0 27 17 22" fill="none" stroke="#b9ac88" stroke-width="3" stroke-linecap="round"/><path d="M-22 -40 L-13 -33M22 -40L13 -33" stroke="#bad1b1" stroke-width="2" opacity=".7"/></g>`}
function bg(){return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8faf0"/><stop offset=".63" stop-color="#e7eee3"/><stop offset="1" stop-color="#dfe8d9"/></linearGradient><linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6d4b5"/><stop offset="1" stop-color="#91ab8e"/></linearGradient><radialGradient id="island" cx=".39" cy=".27" r=".8"><stop stop-color="#dce6c4"/><stop offset=".63" stop-color="#cbdcb8"/><stop offset="1" stop-color="#b9d1a9"/></radialGradient><radialGradient id="skyhalo"><stop offset="0" stop-color="#fff4cf" stop-opacity=".54"/><stop offset=".32" stop-color="#fff4cf" stop-opacity=".24"/><stop offset="1" stop-color="#fff4cf" stop-opacity="0"/></radialGradient></defs><rect width="400" height="620" fill="url(#sky)"/><circle cx="321" cy="133" r="105" fill="url(#skyhalo)"/><circle cx="321" cy="131" r="22" fill="#fff8df" opacity=".65"/><path d="M0 264 Q70 222 130 256 Q213 220 270 246 Q339 214 400 246 V620 H0Z" fill="#e1eadc" opacity=".79"/><path d="M0 299 Q84 276 140 299 Q222 274 282 293 Q337 272 400 292 V620 H0Z" fill="#d8e6d6" opacity=".6"/><path d="M-10 308 Q40 269 91 296 Q140 269 180 292" fill="none" stroke="#fffff1" stroke-width="8" opacity=".18"/><g fill="#c1d1bc" opacity=".45"><path d="M16 263v-40m-12 25l12-29 13 30z"/><path d="M360 246v-45m-13 32l13-32 13 32z"/><path d="M381 257v-34m-10 27l10-28 12 28z"/></g><g opacity=".16" fill="#8caf91"><path d="M-5 351Q10 294 6 256Q32 308 30 352Z"/><path d="M403 338Q385 278 393 257Q371 304 363 335Z"/><path d="M25 375Q37 326 62 319Q51 357 25 375Z"/><path d="M373 361Q349 332 344 306Q374 321 373 361Z"/></g><ellipse cx="200" cy="444" rx="185" ry="119" fill="#557560" opacity=".075"/><path d="M9 390 Q6 323 54 287 Q120 243 200 257 Q297 241 356 289 Q395 322 392 398 L384 437 Q340 509 196 512 Q59 513 13 438Z" fill="url(#earth)" stroke="#9ab596" stroke-width="2"/><ellipse cx="200" cy="379" rx="192" ry="125" fill="url(#island)" stroke="#d4e2be" stroke-width="2.1"/><path d="M33 363 Q96 300 169 321 Q258 291 358 353" fill="none" stroke="#fbfae9" stroke-width="2.5" opacity=".45"/><path d="M41 430 Q137 486 237 460 T362 427" fill="none" stroke="#97b89b" stroke-width="1.5" opacity=".38"/>`}
function world(){let html=bg();const obj=level.obs.map((o,i)=>({...o,index:i,near:projectWorld(o).near}));const foxSpot=level.spots[level.target];const result=visibleCode(eyePoint(angle),foxSpot);const canSee=result!=='X'||solved;
if(canSee){const p={x:foxSpot[0],y:foxSpot[1]};obj.push({...p,type:'fox',near:projectWorld(p).near})}
obj.sort((a,b)=>a.near-b.near);
for(let i=0;i<28;i++){let x=(Math.sin(i*13.2+stage*19)*.5+.5)*.74+.13,y=(Math.sin(i*6.6+5.4+stage*4)*.5+.5)*.73+.14;html+=grass({x,y},i%3===0?.7:1)}
for(let i=0;i<10;i++){let ang=i*2.399+stage*.7,rad=.38+(i%3)*.028,x=.5+rad*Math.cos(ang),y=.5+rad*Math.sin(ang),z=projectWorld({x,y});html+=`<g opacity=".53"><path d="M${sm(z.x)} ${sm(z.y)} l0 -7" stroke="#6e9b76" stroke-width="1.3"/><circle cx="${sm(z.x)}" cy="${sm(z.y-8)}" r="2.7" fill="${i%3===0?'#ebeee1':i%3===1?'#e9c9ad':'#fff8e2'}"/></g>`}
for(const o of obj){if(o.type==='fox')html+=fox(foxSpot);else html+=o.type==='tree'?tree(o,o.index):rock(o,o.index)}
for(let i=0;i<level.spots.length;i++)html+=marker(level.spots[i],i);
html+=`<g opacity=".47"><path d="M85 527 Q200 548 314 526" fill="none" stroke="#a8b9a3" stroke-width="1.1" stroke-dasharray="3 7"/><circle cx="200" cy="537" r="3" fill="#a6bca9"/></g>${owl()}`;
$('world').innerHTML=html;
const label=$('currentDir'),r=visibleCode(eyePoint(angle),foxSpot);
if(drag&&drag.moving){label.textContent='景色を動かしている…'}else{label.textContent=V[selected].name+'から見た景色'}
$('evidence').innerHTML=`<b class="${r==='X'?'':'fox'}">${r==='X'?'キツネは見えない':phrase(r)}</b>${Object.keys(observed).length>1?`<b class="active">${Object.keys(observed).length}つの方向から見た</b>`:''}`;
for(const btn of document.querySelectorAll('.dir')){let idx=Number(btn.dataset.dir);btn.classList.toggle('active',idx===selected&&!drag?.moving);btn.dataset.seen=String(Object.prototype.hasOwnProperty.call(observed,idx))}
$('guess').classList.toggle('show',chosen!==null&&!solved);$('prompt').classList.toggle('gone',firstSwipe||solved);
}
function draw(){world()}
function makeObservation(idx){if(!Object.prototype.hasOwnProperty.call(observed,idx)){observed[idx]=visibleCode(V[idx],level.spots[level.target])}selected=idx;draw()}
function pickAngle(a,animate=true){if(anim)cancelAnimationFrame(anim);anim=0;const v=V.map((p,i)=>({i,d:Math.abs(delta(a,p.a))})).sort((q,r)=>q.d-r.d)[0];let target=angle+delta(angle,V[v.i].a);if(animate&&Math.abs(target-angle)>.01){let start=0,from=angle,d=target-angle;function frame(ts){if(!start)start=ts;const t=Math.min(1,(ts-start)/380);angle=from+d*ease(t);draw();if(t<1)anim=requestAnimationFrame(frame);else{angle=V[v.i].a;anim=0;makeObservation(v.i)}}anim=requestAnimationFrame(frame)}else{angle=V[v.i].a;makeObservation(v.i)}sound('turn')}
function setDirection(idx){if(solved)return;chosen=null;pickAngle(V[idx].a,true);firstSwipe=true}
function evaluate(){if(chosen===null||solved)return;if(chosen!==level.target){wrong++;sound('oops');notify('そこにはいないみたい。別の場所を探そう。');chosen=null;draw();return}solved=true;sound('success');draw();$('win').classList.add('visible');$('winText').innerHTML=`キツネは <strong>${chosen+1} 番</strong> に隠れていた。<br>見る方向を変えると、答えが見えてくる。`;$('next').textContent=stage===levels.length-1?'はじめの森へ　→':'次の森へ　→'}
function reset(){level=levels[stage];angle=V[level.init].a;selected=level.init;observed={};chosen=null;solved=false;wrong=0;firstSwipe=false;drag=null;$('win').classList.remove('visible');$('help').classList.remove('open');$('counter').textContent=String(stage+1).padStart(2,'0')+' / '+String(levels.length).padStart(2,'0');$('subtitle').textContent=stage===0?'見る場所を変えて、隠れたキツネを探そう。':names[stage]+'。どこにキツネがいる？';$('bottomLine').textContent='木や岩の重なりをよく見て、場所を選ぼう。';makeObservation(selected);try{localStorage.setItem('sightlines-atelier-stage',String(stage))}catch{}}
$('dirs').addEventListener('click',e=>{const b=e.target.closest('[data-dir]');if(b)setDirection(Number(b.dataset.dir))});
$('guess').addEventListener('click',evaluate);
$('next').addEventListener('click',()=>{stage=(stage+1)%levels.length;reset()});
$('lookAgain').addEventListener('click',()=>{$('win').classList.remove('visible')});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)sound('select')});
$('hintBtn').addEventListener('click',()=>{$('help').classList.add('open');sound('select')});
$('closeHelp').addEventListener('click',()=>{$('help').classList.remove('open')});
$('help').addEventListener('click',e=>{if(e.target===$('help'))$('help').classList.remove('open')});
const svg=$('world');
svg.addEventListener('pointerdown',e=>{if(solved)return;if(anim)cancelAnimationFrame(anim);anim=0;drag={id:e.pointerId,start:e.clientX,angle,px:e.clientX,py:e.clientY,moving:false,time:performance.now(),spot:e.target.closest('[data-spot]')?.dataset.spot};try{svg.setPointerCapture(e.pointerId)}catch{}});
svg.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||solved)return;const dx=e.clientX-drag.start,dy=e.clientY-drag.py;if(!drag.moving&&Math.hypot(dx,dy)>8)drag.moving=true;if(drag.moving){angle=drag.angle+dx*.010;draw();e.preventDefault()}});
svg.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(d.moving){chosen=null;firstSwipe=true;pickAngle(angle,true)}else if(d.spot!==undefined&&d.spot!==null){chosen=Number(d.spot);sound('select');draw()}else{draw()}});
svg.addEventListener('pointercancel',()=>{drag=null;pickAngle(angle,true)});
reset();
window.__sightlines={get:()=>({stage,selected,angle,observed,chosen,solved}),go:(i)=>setDirection(i),mark:(i)=>{chosen=i;draw()},guess:evaluate,next:()=>{stage=(stage+1)%levels.length;reset()}};
})();
</script>
