<style>

const SOUND_HZ=32000;
let soundBuffers=null,soundBus=null,soundLast={},soundContext=null;
function initSound(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;
 if(!soundContext){
  soundContext=new AC();
  const gain=soundContext.createGain();gain.gain.value=.95;
  const limiter=soundContext.createDynamicsCompressor();
  limiter.threshold.value=-20;limiter.knee.value=10;limiter.ratio.value=4;
  limiter.attack.value=.003;limiter.release.value=.14;
  gain.connect(limiter);limiter.connect(soundContext.destination);soundBus=gain;
  soundBuffers={};
  Object.keys(SOUND_PCM).forEach(key=>{
   const raw=atob(SOUND_PCM[key]);
   const buf=soundContext.createBuffer(1,raw.length/2,SOUND_HZ);
   const chan=buf.getChannelData(0);
   for(let i=0;i<chan.length;i++){
    let v=raw.charCodeAt(2*i)|(raw.charCodeAt(2*i+1)<<8);
    if(v>=32768)v-=65536;
    chan[i]=v/32768;
   }
   soundBuffers[key]=buf;
  });
 }
 if(soundContext.state==='suspended')soundContext.resume().catch(()=>{});
 return true;
}
// All effects are sampled once, then played as-is. No detuning, oscillating notes,
// or stacks of unrelated frequencies. Events are rate-limited to avoid noisy overlap.
function audioEvent(type){
 if(muted||!initSound())return;
 if(!soundBuffers[type])return;
 const now=soundContext.currentTime;
 const minGap={ask:.075,mark:.075,select:.07,lift:.1,swap:.2,land:.1,clue:.25,wrong:.15,win:.6};
 if(now-(soundLast[type]??-10)<(minGap[type]??.07))return;
 soundLast[type]=now;
 try{
  const source=soundContext.createBufferSource();source.buffer=soundBuffers[type];
  const volume=soundContext.createGain();
  volume.gain.value=type==='win'?.82:type==='clue'?.72:1;
  source.connect(volume).connect(soundBus);
  source.start();
 }catch(_){/* audio unavailable: game continues normally */}
}

function buzz(x){try{navigator.vibrate?.(x)}catch(e){}}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,1900)}
function question(id){if(locked)return;if(phase==='listen'){if(id!==st.witness[first.length])return;first.push({id,word:answer(order,st.liars,id)});focus=id;audioEvent('ask');buzz(7);if(first.length===st.witness.length)phase='experiment'}else if(phase==='reask'){if(!st.witness.includes(id)||heard(second,id))return;second.push({id,word:answer(order,st.liars,id)});focus=id;audioEvent('ask');buzz(7);if(remaining().length===1){phase='accuse';setTimeout(()=>audioEvent('clue'),135)}else if(second.length===st.witness.length)phase='retry'}render()}
function mark(id){if(marks.has(id))marks.delete(id);else{if(marks.size>=2)marks.delete(marks.values().next().value);marks.add(id)}audioEvent('mark');buzz(5);render()}
function onAnimal(id){if(locked)return;if(phase==='listen'||phase==='reask')return question(id);if(phase==='experiment'){inspected=null;if(selected===id)selected=null;else if(selected===null)selected=id;else return swap(selected,id);focus=selected;audioEvent('select');render();}else if(phase==='accuse')mark(id)}
function informative(){const ps=beforeCandidates();for(let a=0;a<st.n;a++)for(let b=a+1;b<st.n;b++){let o=initial.slice();[o[a],o[b]]=[o[b],o[a]];for(let w of st.witness)if(new Set(ps.map(p=>answer(o,p,w))).size===ps.length)return {a,b,w}}return null}
function swap(a,b){if(phase!=='experiment'||locked||a===b)return;locked=true;selected=null;focus=null;inspected=null;lastSwap=[a,b];audioEvent('swap');buzz(9);const elA=document.querySelector(`.animal[data-id="${a}"] .portrait`),elB=document.querySelector(`.animal[data-id="${b}"] .portrait`);const duration=reduced()?0:365;
 if(elA&&elB&&duration){const ra=elA.getBoundingClientRect(),rb=elB.getBoundingClientRect(),board=$('board').getBoundingClientRect(),cx=board.left+board.width/2,cy=board.top+board.height/2;
 const fly=(el,from,to,sign)=>{const g=document.createElement('div');g.className='flight';g.innerHTML=el.outerHTML;g.style.left=from.left+'px';g.style.top=from.top+'px';document.body.appendChild(g);el.style.opacity='0';const dx=to.left-from.left,dy=to.top-from.top;const off=(sign===1?1:-1)*Math.min(52,board.width*.11);const norm=Math.hypot(dx,dy)||1;const xmid=dx/2-dy/norm*off,ymid=dy/2+dx/norm*off;g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${xmid}px,${ymid}px) scale(1.10)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(1)`}],{duration,easing:'cubic-bezier(.24,.8,.22,1)',fill:'forwards'});setTimeout(()=>g.remove(),duration+45)};fly(elA,ra,rb,1);fly(elB,rb,ra,-1)}
 setTimeout(()=>{const i=order.indexOf(a),j=order.indexOf(b);[order[i],order[j]]=[order[j],order[i]];second=[];phase='reask';locked=false;audioEvent('land');render();},duration)}
function rewind(){if(locked)return;order=initial.slice();second=[];selected=null;focus=null;inspected=null;phase='experiment';lastSwap=null;render()}
function verdict(){if(marks.size!==2)return;if(same([...marks],st.liars)){phase='win';focus=null;audioEvent('win');buzz([9,50,14]);render();sparks()}else{audioEvent('wrong');toast('まだ違うみたい。もう一度考えてみよう')}}
function sparks(){if(reduced())return;const b=$('board').getBoundingClientRect();for(let i=0;i<18;i++){const p=document.createElement('i');p.className='sparkle';p.style.left=(20+Math.random()*60)+'%';p.style.top=(25+Math.random()*50)+'%';p.style.setProperty('--sx',(Math.random()-.5)*180+'px');p.style.setProperty('--sy',(Math.random()-.5)*170+'px');$('board').appendChild(p);setTimeout(()=>p.remove(),1050)}}

 if(phase==='retry')return {k:'TRY AGAIN',t:'残り 2 組',s:'まだ決められない',p:'別の実験を試そう',g:'今回の交換では候補が残った',a:button('別の交換を試す','undo',true)};
 if(phase==='accuse')return {k:'DEDUCTION',t:'残り 1 組',s:'結果が分かれた',p:'嘘つきの2匹を指摘しよう',g:'顔をタップして2匹に印をつける',a:button(`この2匹で決定　${marks.size}/2`,'verdict',true,marks.size!==2)+button('論理を確認','proof')};
 return {k:'SOLVED',t:'1 組だけ',s:'矛盾なく残った',p:'事件解決。推理がつながった',g:'全組の検算も確認できます',a:button(stage===cases.length-1?'最初の事件へ':'次の事件へ','next',true)+button('なぜ一意？','proof')};
}
function evidence(id){let a=heard(first,id),b=heard(second,id);let word=b?.word||a?.word;
 if(!word)return phase==='listen'&&st.witness.includes(id)?'<div class="bubble unasked">···</div>':'';
 if(b&&a){if(b.word!==a.word)return `<div class="bubble changed"><span class="old">${a.word}</span><span class="arrow">→</span>${b.word}</div>`;return `<div class="bubble settled"><span class="old smallbefore">前</span>${b.word}</div>`;}
 let prior=phase==='reask'||phase==='retry'||phase==='accuse'||phase==='win';
 return `<div class="bubble ${word==='YES'?'yes':''} ${prior?'prior':''}">${prior?'<span class="old smallbefore">前</span>':''}${word}</div>`;
}
const miniPair=p=>p.map(id=>`<span class="tiny-animal" aria-label="${name(id)}">${avatar(id)}</span>`).join('');
function centralPanel(){
 const ps=beforeCandidates();
 if(phase==='listen')return `<div class="core-label">ONE BY ONE</div><div class="core-main">${first.length}<span class="core-total"> / ${st.witness.length}</span></div><div class="core-sub">ゆっくり聞こう</div>`;
 if(phase==='win')return `<div class="core-label">SOLVED</div><div class="core-solved">${miniPair(st.liars)}</div><div class="core-sub">嘘つきは、この2匹</div>`;
 if(ps.length!==2)return `<div class="core-label">REASONING</div><div class="core-main">残り ${remaining().length} 組</div>`;
 const last=second.length?second[second.length-1]:null;
 const rows=ps.map((pair,i)=>{let predicted=last?answer(order,pair,last.id):null,valid=last?predicted===last.word:null;
 return `<button type="button" class="candidate-pair ${inspected===i?'inspected':''} ${last?(valid?'survives':'eliminated'):''}" data-hyp="${i}" aria-label="仮説${i?'B':'A'}、候補の2匹をハイライト"><span class="candidate-letter">${i?'B':'A'}</span><span class="pair-portraits">${miniPair(pair)}</span>${last?`<span class="candidate-predict">${predicted}</span><span class="candidate-check">${valid?'✓':'×'}</span>`:''}</button>`}).join('');
 return `<div class="core-label">${last?'答えを照らし合わせる':'2つの仮説'}</div><div class="candidate-list">${rows}</div><div class="core-sub">${last?'✓ が残る組。× は矛盾':'タップで候補を確認'}</div>`;
}
function paintRelations(){
 if(pointer?.moved&&dragTarget!==null){let fake=order.slice(),a=pointer.id,b=dragTarget,i=fake.indexOf(a),j=fake.indexOf(b);[fake[i],fake[j]]=[fake[j],fake[i]];let targetIndex=fake.indexOf(a),center=place(targetIndex),n=fake.length,paths='';for(const k of [(targetIndex+n-1)%n,(targetIndex+1)%n]){let end=place(k),mx=(center.x+end.x)*2,my=(center.y+end.y)*2;paths+=`<path class="preview" d="M ${center.x*4} ${center.y*4} Q ${mx*.73+54} ${my*.73+54} ${end.x*4} ${end.y*4}"/>`}$('links').innerHTML=paths;return;}
 if(focus===null){$('links').innerHTML='';return}let idx=order.indexOf(focus),near=neighbors(focus);let s=place(idx),paths='';for(let other of near){let e=place(order.indexOf(other));let mx=(s.x+e.x)*2,my=(s.y+e.y)*2;let qx=mx*.72+200*.28,qy=my*.72+200*.28;paths+=`<path d="M ${s.x*4} ${s.y*4} Q ${qx} ${qy} ${e.x*4} ${e.y*4}"/>`}$('links').innerHTML=paths
}
function paintSeats(){let active=phase==='listen'?st.witness[first.length]:null;let near=focus!==null?neighbors(focus):[];
 $('seats').innerHTML=order.map((id,position)=>{let p=place(position),cl=['animal'];if(active===id||phase==='reask'&&st.witness.includes(id)&&!heard(second,id))cl.push('ready');if(near.includes(id))cl.push('near');if(selected===id)cl.push('picked');if(marks.has(id))cl.push('marked');if(inspected!==null&&beforeCandidates()[inspected]?.includes(id))cl.push('hypothesis-lit');if(inspected!==null&&!beforeCandidates()[inspected]?.includes(id))cl.push('hypothesis-muted');if(phase==='win')cl.push(st.liars.includes(id)?'liar':'safe');return `<div class="seat" style="--x:${p.x}%;--y:${p.y}%" data-seat="${position}"><button type="button" class="${cl.join(' ')}" data-id="${id}" aria-label="${name(id)}：${heard(second,id)?.word||heard(first,id)?.word||'未質問'}">${avatar(id)}</button>${evidence(id)}<button type="button" class="memo ${marks.has(id)?'active':''} ${phase==='accuse'?'in-answer':''}" data-mark="${id}" aria-label="${name(id)}：容疑者マーク"><span class="dot">${marks.has(id)?'!':phase==='accuse'?'?':''}</span></button></div>`}).join('');}
function render(){let info=uiText();$('caseCount').textContent=`${String(stage+1).padStart(2,'0')} / ${String(cases.length).padStart(2,'0')}`;$('chapter').textContent=st.caption;[...$('progress').children].forEach((v,i)=>v.className=i<stagePart()?'passed':i===stagePart()?'now':'');$('core').innerHTML=centralPanel();$('prompt').textContent=info.p;$('guide').textContent=info.g;$('actions').innerHTML=info.a;paintSeats();paintRelations()}
const hypoMarkup=p=>`<div class="hypo"><label>可能性</label><div class="mini">${p.map(x=>avatar(x)).join('')}</div></div>`;
function openSheet(type='hint'){let content='';if(type==='proof'){
 const combos=pairs(st.n),ps=beforeCandidates(),rs=remaining();
 const checks=combos.map(p=>{let firstMismatch=first.find(x=>answer(initial,p,x.id)!==x.word),secondMismatch=!firstMismatch?second.find(x=>answer(order,p,x.id)!==x.word):null;
 const txt=firstMismatch?'最初の証言と矛盾':secondMismatch?'再質問で矛盾':'すべて一致';let cls=firstMismatch?'rejected':secondMismatch?'tested':'valid';return `<div class="audit-row ${cls}"><span class="audit-animals">${miniPair(p)}</span><span class="audit-explain">${txt}</span>${cls==='valid'?'<span class="audit-mark">✓</span>':'<span class="audit-mark">×</span>'}</div>`}).join('');
 const last=second.length?second[second.length-1]:null;
 let compare=last&&ps.length===2?`<div class="proof-comparison"><div class="proof-intro">最後に質問した動物の答え：<b>${last.word}</b></div>${ps.map((p,i)=>`<div class="proof-choice"><span>${i?'B':'A'}</span><span>${miniPair(p)}</span><b>${answer(order,p,last.id)}</b><em>${answer(order,p,last.id)===last.word?'一致':'矛盾'}</em></div>`).join('')}</div>`:'';
 content=`<div class="eyebrow">CHECK EVERY POSSIBILITY</div><h2>答えは本当に1組？</h2><p>嘘つきは<strong>ちょうど2匹</strong>。${st.n}匹から2匹を選ぶ<strong>${combos.length}通りすべて</strong>について、全員が正直または嘘をつくルールに照らして検査しています。</p><div class="audit-stats"><div><strong>${combos.length}</strong><small>全組合せ</small></div><span>→</span><div><strong>${ps.length}</strong><small>最初の証言後</small></div><span>→</span><div><strong>${rs.length}</strong><small>再質問後</small></div></div>${compare}<div class="audit-title">全${combos.length}組の照合結果</div><div class="audit-list">${checks}</div><p class="audit-note">この検算はゲーム内の答えを見て決めているのではなく、考えられる全組合せに発言ルールを適用した結果です。</p>`;
 }else if(type==='help'){content=`<div class="eyebrow">HOW TO PLAY</div><h2>席替えは、実験だ。</h2><p>6匹までの動物の中に、<strong>嘘つきが2匹。</strong> 正直者は本当のことを言い、嘘つきは必ず逆のことを言う。</p><p>みんなに聞くのは、<strong>「両隣は正直者と嘘つきが1匹ずつ？」</strong>という同じ質問。</p><p>① 光る動物を順番にタップして聞く。<br>② 動物をドラッグして2匹の席を交換する。<br>③ 最初に話した動物へ再質問する。<br>④ 嘘つき2匹に印を付けて指摘する。</p><p>動物の右上の小さな点を押すか、顔を長押しすると容疑者マークを付けられる。席替えで印も一緒に動く。</p>`}
 else if(type==='detail'){content=`<div class="eyebrow">THE ANSWER</div><h2>なぜ、わかった？</h2><p>最初の3つの証言と矛盾しない組は、次の2通り。</p><div class="hypotheses">${beforeCandidates().map(hypoMarkup).join('')}</div><p>${lastSwap?`${name(lastSwap[0])}と${name(lastSwap[1])}の席を入れ替えた後、`:''}聞き直した証言を合わせると、<strong>${st.liars.map(name).join('と')}</strong>だけが残る。</p><p>席替えは、発言を合わせる操作ではない。<strong>2つの仮説を見分けるための実験</strong>だったんだ。</p>`}
 else {guideLevel=Math.min(guideLevel+1,3);if(phase==='listen'){content=`<div class="eyebrow">A SMALL CLUE</div><h2>3匹だけを見よう。</h2><p>一度に全員を考える必要はない。今話している動物と、その両隣だけを見る。YESでも、話し手が嘘つきなら意味が逆になるよ。</p>`}else if(guideLevel===1){content=`<div class="eyebrow">A SMALL CLUE</div><h2>答えはまだ、2通り。</h2><p>最初の証言だけでは決められない。<strong>どの席を交換したら2つの仮説の答えが分かれるか</strong>、そこが考えどころ。</p>`}else if(guideLevel===2){content=`<div class="eyebrow">TWO POSSIBILITIES</div><h2>どっちが嘘つき？</h2><p>最初の証言と矛盾しない2組は、こちら。</p><div class="hypotheses">${beforeCandidates().map(hypoMarkup).join('')}</div><p>どちらの組でも今の発言は同じ。交換したら、違いが出るだろうか？</p>`}else{let g=informative();content=`<div class="eyebrow">ONE USEFUL TEST</div><h2>この席替えを試そう。</h2><div class="hypotheses">${g?`<div class="hypo"><label>交換</label><div class="mini">${avatar(g.a)}${avatar(g.b)}</div></div><div class="hypo"><label>再質問</label><div class="mini">${avatar(g.w)}</div></div>`:''}</div><p>この交換と再質問なら、2つの仮説で答えが異なるはず。</p>`}}
 $('sheet').innerHTML=`<div class="line"></div>${content}<div class="footbtns">${type==='hint'&&guideLevel<3&&phase!=='listen'?button('次のヒント','more'):''}${button('円卓にもどる','close',true)}</div>`;$('veil').hidden=false;}
function closeSheet(){$('veil').hidden=true}
$('veil').addEventListener('click',e=>{if(e.target===$('veil'))closeSheet();let a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='more')openSheet('hint');else if(a.dataset.action==='close')closeSheet()}});
$('core').addEventListener('click',e=>{let b=e.target.closest('[data-hyp]');if(!b||locked)return;let i=+b.dataset.hyp;inspected=inspected===i?null:i;selected=null;focus=null;render()});
$('actions').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'help':openSheet('help');break;case'hint':openSheet('hint');break;case'undo':rewind();break;case'restart':reset();break;case'verdict':verdict();break;case'next':stage=(stage+1)%cases.length;reset();break;case'detail':openSheet('detail');break;case'proof':openSheet('proof');break;}});
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').querySelector('.wave').style.display=muted?'none':'block';$('soundBtn').setAttribute('aria-label',muted?'音を出す':'音を切る');if(!muted)audioEvent('select')});$('helpBtn').addEventListener('click',()=>openSheet('help'));
function dropAt(x,y,exclude){let found=null,dist=Infinity;document.querySelectorAll('.animal').forEach(el=>{const id=+el.dataset.id;if(id===exclude)return;let r=el.querySelector('.portrait').getBoundingClientRect(),d=Math.hypot(r.left+r.width/2-x,r.top+r.height/2-y);if(d<Math.max(59,r.width*.95)&&d<dist){dist=d;found=id}});return found}
function clearPointer(){clearTimeout(holdTimer);holdTimer=null;pointer=null;dragTarget=null;$('follower').style.display='none';document.querySelectorAll('.animal.drop,.animal.dim').forEach(el=>el.classList.remove('drop','dim'));paintRelations()}
$('seats').addEventListener('pointerdown',e=>{if(e.target.closest('.memo'))return;const b=e.target.closest('.animal');if(!b||locked)return;if(pointer)return;let id=+b.dataset.id;pointer={id,pid:e.pointerId,x:e.clientX,y:e.clientY,moved:false,longPressed:false};try{b.setPointerCapture(e.pointerId)}catch(_){}
 holdTimer=setTimeout(()=>{if(pointer&&!pointer.moved){clearPointer();ignoreClick=Date.now()+400;mark(id)}},520)});
$('seats').addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.pid||locked)return;let p=pointer;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>9){clearTimeout(holdTimer);if(phase==='experiment'){p.moved=true;audioEvent('lift')}}if(!p.moved||phase!=='experiment')return;if($('follower').style.display!=='block'){$('follower').innerHTML=avatar(p.id);$('follower').style.display='block'}$('follower').style.left=e.clientX+'px';$('follower').style.top=e.clientY+'px';let target=dropAt(e.clientX,e.clientY,p.id);if(target!==dragTarget){dragTarget=target;paintRelations()}document.querySelectorAll('.animal').forEach(el=>{el.classList.toggle('drop',+el.dataset.id===dragTarget);el.classList.toggle('dim',+el.dataset.id===p.id)});e.preventDefault();},{passive:false});
$('seats').addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.pid)return;const p=pointer,target=p.moved?dropAt(e.clientX,e.clientY,p.id):null;clearPointer();ignoreClick=Date.now()+350;if(p.longPressed)return;if(p.moved){if(target!==null)swap(p.id,target);else toast('交換する動物の上で指を離そう')}else onAnimal(p.id)});
$('seats').addEventListener('pointercancel',()=>{if(pointer)clearPointer()});
$('seats').addEventListener('click',e=>{let m=e.target.closest('.memo');if(m){mark(+m.dataset.mark);return}if(e.detail===0){let b=e.target.closest('.animal');if(b)onAnimal(+b.dataset.id)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.__entakuV6={get:()=>({stage,phase,order:[...order],first:[...first],second:[...second],candidates:remaining(),marks:[...marks],liars:st.liars,beforeCandidates:beforeCandidates(),allPairs:pairs(st.n)}),answer,question,swap,mark,rewind,reset,proof:()=>openSheet('proof'),next:()=>{stage=(stage+1)%cases.length;reset()},informative,verdict};
reset();
})();
</script>
</body></html>
