function rock(g,x,y,r,h,s=1){g.save();g.translate(x,y);g.scale(s,s);const w=r*62,hei=h*27;disc(g,0,4,w*1.05,10,'#56786526');polygon(g,[[-w,0],[-w*.83,-hei*.57],[-w*.26,-hei],[w*.46,-hei*.93],[w*.94,-hei*.42],[w,0]],'#7caaa0');polygon(g,[[-w*.83,-hei*.57],[-w*.26,-hei],[w*.46,-hei*.93],[w*.23,-hei*.53]],'#a1c7b9');polygon(g,[[w*.23,-hei*.53],[w*.46,-hei*.93],[w*.94,-hei*.42],[w,0],[w*.21,0]],'#729b93');branch(g,-w*.3,-hei*.35,w*.12,-hei*.30,'#bed8c6',1.5);g.restore()}
function foxDraw(g,x,y,s=1,face='N',view='S',onlyEars=false){
 // Fox's orientation is a fixed world direction. The observer direction determines front, profile or back.
 const V={N:[0,-1],S:[0,1],E:[-1,0],W:[1,0]};const F={N:[0,1],S:[0,-1],E:[1,0],W:[-1,0]};
 const f=F[face],v=V[view],dot=f[0]*v[0]+f[1]*v[1],right=[-v[1],v[0]],side=f[0]*right[0]+f[1]*right[1];
 g.save();g.translate(x,y);g.scale(s,s);
 if(onlyEars){polygon(g,[[-13,-1],[-13,-24],[-3,-4]],'#ca7755');polygon(g,[[4,-5],[13,-24],[14,0]],'#ca7755');polygon(g,[[-11,-6],[-10,-18],[-6,-5]],'#f4c3a2');polygon(g,[[7,-5],[10,-18],[11,-5]],'#f4c3a2');g.restore();return}
 disc(g,0,4,20,6,'#2f5f5033');
 if(Math.abs(side)>.5){const sgn=side>0?1:-1;g.save();g.translate(-sgn*10,-11);g.rotate(sgn*.36);disc(g,-sgn*7,-2,23,10,'#c37752');disc(g,-sgn*25,-2,7,6,'#fff0d7');g.restore()}
 disc(g,0,-15,16,19,'#c87855');polygon(g,[[-18,-26],[-16,-56],[-2,-36]],'#bd694b');polygon(g,[[2,-36],[16,-56],[18,-26]],'#bd694b');polygon(g,[[-13,-29],[-13,-45],[-4,-35]],'#f3caa5');polygon(g,[[4,-35],[12,-45],[13,-29]],'#f3caa5');
 if(dot<-.55){disc(g,0,-26,17,18,'#bc6d4f');disc(g,-6,-31,4,6,'#d88c67');disc(g,6,-31,4,6,'#d88c67');if(Math.abs(side)<.55){g.save();g.translate(8,-9);g.rotate(-.35);disc(g,15,-3,16,9,'#d18a62');g.restore()}}
 else if(Math.abs(side)>.55){const sgn=side>0?1:-1;disc(g,0,-27,18,17,'#db855d');polygon(g,[[sgn*6,-28],[sgn*30,-22],[sgn*8,-10]],'#f9edd6');disc(g,sgn*13,-30,2.4,2.5,'#385044');disc(g,sgn*29,-22,3,3,'#4c4e41')}
 else{disc(g,0,-28,19,16,'#de895d');polygon(g,[[-18,-23],[0,-12],[18,-23],[13,-13],[-13,-13]],'#f7edd9');disc(g,-8,-30,2.3,2.7,'#394c42');disc(g,8,-30,2.3,2.7,'#394c42');disc(g,0,-16,3,2.5,'#45483d')}
 g.restore()}
function lineBlocked(dir,height,sp,z,obs){const [ox,oy]=DIR[dir].p,dx=sp.x-ox,dy=sp.y-oy,d=dx*dx+dy*dy;for(const o of obs){const t=((o.x-ox)*dx+(o.y-oy)*dy)/d;if(t<=.06||t>=.96)continue;const px=ox+t*dx,py=oy+t*dy;if(Math.hypot(o.x-px,o.y-py)<o.r){const lineZ=height+(z-height)*t;if(lineZ<o.h-.04)return true}}return false}
function sight(w,sp,obs){let head=!lineBlocked(w.dir,ANIMALS[w.a].height,sp,.79,obs),ears=!lineBlocked(w.dir,ANIMALS[w.a].height,sp,1.32,obs);let kind=head?2:ears?1:0;if(!kind)return [0,0];let b=['N','S'].includes(w.dir)?sp.x:sp.y;if(['N','E'].includes(w.dir))b=-b;return [kind,b<-.18?-1:b>.18?1:0]}
function sceneVerify(l){return SPOTS.filter(sp=>l.witness.every(w=>JSON.stringify(sight(w,sp,l.obstacles))===JSON.stringify(sight(w,SPOTS[l.fox],l.obstacles)))).length===1}
const boardPos=sp=>({x:200+sp.x*92,y:223-sp.y*77});
function map(){const g=bctx;g.save();g.setTransform(board.width/400,0,0,board.height/395,0,0);g.clearRect(0,0,400,395);const grad=g.createLinearGradient(0,0,0,395);grad.addColorStop(0,'#f9fcf6');grad.addColorStop(.56,'#e9f3e6');grad.addColorStop(1,'#dae9d5');g.fillStyle=grad;g.fillRect(0,0,400,395);
 disc(g,201,228,179,132,'#7aa58d24');disc(g,201,213,176,134,'#bad6b1');disc(g,201,204,173,129,'#e5efda');disc(g,201,203,160,115,'#e9f0de');g.strokeStyle='#cadfc6';g.lineWidth=1;g.beginPath();g.ellipse(201,213,176,134,0,0,Math.PI*2);g.stroke();
 // Foreground non-interactive geometry and hiding bushes, painted by ground depth.
 const models=[...level().obstacles.map(o=>({...o,style:o.type,depth:o.y})),...SPOTS.map((s,i)=>({...s,style:'spot',id:i,depth:s.y}))].sort((a,b)=>b.depth-a.depth);
 for(const ob of models){const p=boardPos(ob);if(ob.style==='tree')tree(g,p.x,p.y,ob.r,Math.min(ob.h,3.6),.62,false);if(ob.style==='rock')rock(g,p.x,p.y,ob.r,ob.h,.88);if(ob.style==='bush')shrub(g,p.x,p.y,.64);if(ob.style==='spot'){disc(g,p.x,p.y+7,30,12,'#2d675b24');shrub(g,p.x,p.y,.97,true);if(completed&&ob.id===level().fox)foxDraw(g,p.x,p.y-6,.62,level().foxFace,'S',false)}}
 // Put readable selection markers in FRONT of all geometry (never obstructed).
 SPOTS.forEach((sp,i)=>{const p=boardPos(sp);const yy=p.y+29;disc(g,p.x,yy,15.5,15.5,completed&&i===level().fox?'#f7deac':miss===i?'#f5ded7':'#fffdf8');g.beginPath();g.arc(p.x,yy,15.5,0,Math.PI*2);g.lineWidth=1.4;g.strokeStyle=completed&&i===level().fox?'#be9251':miss===i?'#cf9387':'#b9d1bf';g.stroke();g.textAlign='center';g.textBaseline='middle';g.font='700 13px system-ui';g.fillStyle='#547868';g.fillText(String(i+1),p.x,yy+1)});
 if(completed){g.font='800 13px Georgia,serif';g.textAlign='center';g.fillStyle='#3d836c';g.fillText('FOUND YOU',201,353)}
 g.restore()}
function observerProject(w,pos,z){const cam=DIR[w.dir],dx=pos.x-cam.p[0],dy=pos.y-cam.p[1],f=cam.f,right=[f[1],-f[0]],distance=dx*f[0]+dy*f[1],lat=dx*right[0]+dy*right[1],height=ANIMALS[w.a].height;
 const elev=Math.atan2(Math.max(.03,height-.63),3.45),persp=1/(1+.047*(distance-3.1));const sx=200+lat*96*persp;const ground=177-(distance-3.1)*(4+45*Math.sin(elev));const sy=ground-z*41*Math.cos(elev)*persp;return{x:sx,y:sy,base:ground,scale:persp,depth:distance,elev}}
function witnessScene(c,w){const g=c.getContext('2d');g.save();g.setTransform(c.width/400,0,0,c.height/235,0,0);g.clearRect(0,0,400,235);const elev=observerProject(w,{x:0,y:0},0).elev;const grad=g.createLinearGradient(0,0,0,235);grad.addColorStop(0,'#e4f1ed');grad.addColorStop(.54,'#f5f5e9');grad.addColorStop(1,'#bfd8ba');g.fillStyle=grad;g.fillRect(0,0,400,235);disc(g,200,212,270,55,'#a6c49a');disc(g,200,206,240,40,'#d9e6bd');
 const items=[...level().obstacles.map(o=>({...o,style:o.type})),...SPOTS.map((s,i)=>({...s,style:'spot',id:i})),{...SPOTS[level().fox],style:'fox',id:-1}];items.forEach(o=>{o.proj=observerProject(w,o,0)});items.sort((a,b)=>b.proj.depth-a.proj.depth);
 const res=sight(w,SPOTS[level().fox],level().obstacles),kind=res[0];
 for(const ob of items){const p=ob.proj;const sf=p.scale*(.79+.14*Math.cos(elev));if(ob.style==='tree'){tree(g,p.x,p.base,ob.r,ob.h,Math.min(1.18,sf),ANIMALS[w.a].height>2.4)}if(ob.style==='rock')rock(g,p.x,p.base,ob.r,ob.h,Math.min(1.35,sf));if(ob.style==='bush')shrub(g,p.x,p.base,Math.min(1.25,sf*.90));if(ob.style==='spot')shrub(g,p.x,p.base,Math.min(1.1,sf*.63));if(ob.style==='fox'&&kind){const p2=observerProject(w,ob,0);g.save();g.translate(0,-.5);if(kind===1){const y=p2.y-1.32*41*Math.cos(elev)*p2.scale+10;foxDraw(g,p.x,y,Math.min(1.3,p2.scale*.78),level().foxFace,w.dir,true)}else{foxDraw(g,p.x,p.base,Math.min(1.23,sf*.93),level().foxFace,w.dir,false)}g.restore()}}
 // For an ear-only observation, overlay the visible tips to guarantee legibility at card size.
 if(kind===1){const sp=SPOTS[level().fox],p=observerProject(w,sp,0);foxDraw(g,p.x,p.base-1.32*41*Math.cos(elev)*p.scale+10,Math.min(1.3,p.scale*.78),level().foxFace,w.dir,true)}
 // Luminous horizontal foreground; high view reveals more ground.
 disc(g,200,252,310,35,'#729c7d40');g.fillStyle='#568879';g.textAlign='left';g.font='700 9px system-ui';g.fillText(DIR[w.dir].name+'から →',13,18);g.textAlign='right';g.fillText('EYE '+(ANIMALS[w.a].height).toFixed(1)+'m',385,18);
 g.restore()}
function sceneState(w){const state=sight(w,SPOTS[level().fox],level().obstacles)[0];return state===2?'キツネが見えた':state===1?'耳だけ見えた':'キツネは見えない'}
function cardsRender(){cards.innerHTML='';level().witness.forEach(w=>{const a=ANIMALS[w.a],d=DIR[w.dir],b=document.createElement('button');b.className='wcard';b.type='button';b.setAttribute('aria-label',`${a.name}が${d.name}側から見た景色を拡大`);b.innerHTML=`<div class="wheader"><div class="face">${animalSVG(w.a)}</div><div class="wtitle"><strong>${a.name}</strong><small>${d.name}側 ${d.arrow} · 目の高さ ${a.height.toFixed(1)}m</small></div></div><canvas class="snap" width="800" height="470"></canvas><div class="statement"><span>${sceneState(w)}</span><span class="sub">拡大 ↗</span></div>`;cards.append(b);witnessScene(b.querySelector('canvas'),w);b.addEventListener('click',()=>{sound('pick');activeModal=w;$('#sheet-title').textContent=`${a.name}が ${d.name}側から見た景色`;$('#sheet-caption').textContent=`目の高さ ${a.height.toFixed(1)}m。${sceneState(w)}。方角と障害物の重なりを見比べよう。`;witnessScene(bigCanvas,w);sheet.hidden=false})})}
function showToast(label,detail='',dur=1800){clearTimeout(timer);toast.innerHTML=label+(detail?`<span>${detail}</span>`:'');toast.classList.add('show');timer=setTimeout(()=>toast.classList.remove('show'),dur)}
function reset(){completed=false;miss=-1;$('#count').textContent=String(stage+1).padStart(2,'0')+' / '+String(LEVELS.length).padStart(2,'0');$('#headline').textContent='キツネはどの茂みに？';$('#desc').textContent='同じ森、違う高さ。2匹の景色を合わせよう。';$('#help').hidden=false;$('#next').hidden=true;$('#footnote').textContent='目の高さによって、岩や木の向こうの見え方が変わる。';map();cardsRender()}
board.addEventListener('click',e=>{if(completed)return;const r=board.getBoundingClientRect(),x=(e.clientX-r.left)*400/r.width,y=(e.clientY-r.top)*395/r.height;const distances=SPOTS.map((sp,i)=>{const p=boardPos(sp);return {i,d:Math.hypot(p.x-x,p.y+17-y)}}).sort((a,b)=>a.d-b.d);if(!distances.length||distances[0].d>46)return;const i=distances[0].i;if(i!==level().fox){miss=i;sound('wrong');showToast('そこじゃないみたい','2匹の高さ・見えた位置を、もう一度見比べてみよう。',1600);map();setTimeout(()=>{if(!completed){miss=-1;map()}},730);return}completed=true;miss=-1;sound('win');$('#headline').textContent='みつけた！';$('#desc').textContent='違う高さから見た景色が、ひとつにつながった。';$('#next').hidden=false;$('#help').hidden=true;$('#footnote').textContent='キツネはずっとここにいた。見え方だけが違った。';map();showToast('みつけた！ ✦','同じ場所でも、目の高さで見えるものが変わる。',2500)});
$('#help').addEventListener('click',()=>{sound('pick');showToast('東西南北は見取り図と同じ','ネズミは低い目線、キリンやフクロウは高い目線。岩に隠れるのはどの場所？',4200)});
$('#next').addEventListener('click',()=>{sound('pick');stage=(stage+1)%LEVELS.length;reset();window.scrollTo({top:0,behavior:'smooth'})});$('#sound').innerHTML=svgSound();$('#sound').addEventListener('click',()=>{soundOn=!soundOn;$('#sound').innerHTML=svgSound();if(soundOn)sound('pick')});$('#close').addEventListener('click',()=>sheet.hidden=true);sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});window.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
window.__sightlinesV4={LEVELS,SPOTS,ANIMALS,sight,sceneVerify,verifyAll:()=>LEVELS.every(sceneVerify),goto:(i)=>{stage=i;reset()},reveal:()=>{completed=true;map()},stage:()=>stage};
if(!LEVELS.every(sceneVerify))throw Error('Puzzle set not uniquely solvable');reset();
})();
